<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Octopus Portal</title>
    <style>
      /*
       * Initial-load spinner, shown while the JS bundle downloads and the app
       * boots. It lives inside #root, so React replaces it on its first commit.
       */
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
      }
      .app-loading {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
      }
      .app-loading-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #e6e8eb;
        border-top-color: #1677ff;
        border-radius: 50%;
        animation: app-spin 0.8s linear infinite;
      }
      @keyframes app-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-loading-spinner {
          animation-duration: 1.6s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loading" role="status" aria-label="Loading">
        <div class="app-loading-spinner"></div>
      </div>
    </div>
  </body>
</html>
